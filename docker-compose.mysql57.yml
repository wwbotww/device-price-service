services:
  mysql57:
    platform: linux/amd64
    image: mysql:5.7.36
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: device_price
      MYSQL_USER: device_price
      MYSQL_PASSWORD: device-price-local
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL57_FORWARD_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit-defaults-for-timestamp=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udevice_price", "-pdevice-price-local"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - mysql57-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql57-data:
