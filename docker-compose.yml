services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: device_price
      MYSQL_USER: device_price
      MYSQL_PASSWORD: device-price-local
      TZ: UTC
    ports:
      - "${MYSQL_FORWARD_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udevice_price", "-pdevice-price-local"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
