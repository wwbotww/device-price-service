[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "device-price-service"
version = "0.1.0"
description = "Auditable public price collection and MySQL persistence service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14",
  "apscheduler>=3.11,<4",
  "httpx>=0.28",
  "playwright>=1.50",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pymysql>=1.1",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "typer>=0.15",
  "xlrd>=2.0.2,<3",
]

[project.scripts]
device-price = "device_price_service.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/device_price_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires the dedicated MySQL integration database",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["device_price_service"]
mypy_path = "src"
